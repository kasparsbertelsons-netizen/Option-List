<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<title>MLK Read Me — Option List Filler</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f2124">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MLK ReadMe">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#c0392b;
    --red-dark:#96281c;
    --grey-900:#1f2124;
    --grey-700:#3d4045;
    --grey-400:#8a8f96;
    --grey-200:#e4e6e9;
    --grey-100:#f4f5f6;
    --white:#ffffff;
    --ok:#2f8f5b;
    --warn:#c98a1a;
    --crit:#c0392b;
    --none:#b8bcc2;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:var(--grey-100);
    color:var(--grey-900);
  }
  .app{max-width:980px;margin:0 auto;padding:28px 20px 80px;}
  header.top{
    display:flex;justify-content:space-between;align-items:flex-start;
    border-bottom:3px solid var(--grey-900);
    padding-bottom:16px;margin-bottom:20px;flex-wrap:wrap;gap:12px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .brand .mark{
    width:34px;height:34px;background:var(--red);border-radius:6px;
    display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:15px;
  }
  .brand h1{font-size:17px;margin:0;letter-spacing:.2px;}
  .brand p{margin:0;font-size:11px;color:var(--grey-400);text-transform:uppercase;letter-spacing:.08em;}
  .progress-wrap{min-width:220px;}
  .progress-label{font-size:11px;color:var(--grey-700);display:flex;justify-content:space-between;margin-bottom:4px;font-weight:500;}
  .progress-bar{height:8px;background:var(--grey-200);border-radius:99px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--red);transition:width .25s ease;}

  .meta-card{
    background:var(--white);border:1px solid var(--grey-200);border-radius:var(--radius);
    padding:16px 18px;margin-bottom:22px;
  }
  .meta-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
  .field label{display:block;font-size:11px;color:var(--grey-700);margin-bottom:4px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;}
  input[type=text],input[type=number],select,textarea{
    width:100%;padding:8px 10px;border:1px solid var(--grey-200);border-radius:6px;
    font-family:'Poppins',sans-serif;font-size:13.5px;background:var(--white);color:var(--grey-900);
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--red);outline-offset:1px;border-color:var(--red);}

  .toolbar{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  button{
    font-family:'Poppins',sans-serif;font-size:13px;font-weight:500;
    border-radius:7px;padding:9px 15px;border:1px solid var(--grey-900);
    background:var(--white);color:var(--grey-900);cursor:pointer;transition:.15s;
  }
  button:hover{background:var(--grey-900);color:var(--white);}
  button.primary{background:var(--red);border-color:var(--red);color:white;}
  button.primary:hover{background:var(--red-dark);border-color:var(--red-dark);}
  button.ghost{border-color:var(--grey-200);color:var(--grey-700);}
  button.ghost:hover{background:var(--grey-200);color:var(--grey-900);}
  button:disabled{opacity:.45;cursor:not-allowed;}
  button:disabled:hover{background:var(--white);color:var(--grey-900);}

  .section{
    background:var(--white);border:1px solid var(--grey-200);border-radius:var(--radius);
    margin-bottom:14px;overflow:hidden;
  }
  .section-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:13px 16px;cursor:pointer;background:var(--grey-100);border-bottom:1px solid var(--grey-200);
  }
  .section-head h2{font-size:14px;margin:0;font-weight:600;}
  .section-head .count{font-size:11.5px;color:var(--grey-400);font-weight:500;}
  .section-body{padding:6px 16px 12px;}
  .section.collapsed .section-body{display:none;}
  .chevron{transition:transform .2s;color:var(--grey-400);}
  .section.collapsed .chevron{transform:rotate(-90deg);}

  .row{
    display:grid;grid-template-columns:200px 1fr 1fr auto;gap:10px;align-items:start;
    padding:10px 0;border-bottom:1px solid var(--grey-100);
  }
  .row:last-child{border-bottom:none;}
  .row .lv{font-size:13px;font-weight:500;padding-top:8px;}
  .row .lv small{display:block;font-weight:400;color:var(--grey-400);font-size:10.5px;margin-top:1px;}
  .row .extra-input{margin-top:6px;}
  .row .comment textarea{min-height:34px;resize:vertical;font-size:12.5px;}
  .badge{
    align-self:center;font-size:10.5px;font-weight:600;padding:4px 9px;border-radius:99px;
    white-space:nowrap;text-align:center;min-width:86px;
  }
  .badge.ok{background:#e3f3ea;color:var(--ok);}
  .badge.warn{background:#fbf0dc;color:var(--warn);}
  .badge.none{background:var(--grey-100);color:var(--grey-400);}

  @media(max-width:720px){
    .row{grid-template-columns:1fr;gap:6px;}
    .badge{justify-self:start;}
  }

  .results{
    background:var(--white);border:1px solid var(--grey-200);border-radius:var(--radius);
    padding:20px;margin-top:22px;
  }
  .results h2{font-size:16px;margin-top:0;}
  .tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:2px solid var(--grey-200);}
  .tab{padding:8px 14px;font-size:13px;font-weight:500;cursor:pointer;color:var(--grey-400);border-bottom:2px solid transparent;margin-bottom:-2px;}
  .tab.active{color:var(--red);border-color:var(--red);}
  .tabpanel{display:none;}
  .tabpanel.active{display:block;}

  table.filled{width:100%;border-collapse:collapse;font-size:12.5px;}
  table.filled th,table.filled td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--grey-100);}
  table.filled th{background:var(--grey-100);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--grey-700);}
  table.filled td.status-ok{color:var(--ok);font-weight:600;}
  table.filled td.status-warn{color:var(--warn);font-weight:600;}

  .qlist{list-style:none;margin:0;padding:0;counter-reset:q;}
  .qlist li{
    counter-increment:q;padding:12px 14px 12px 40px;position:relative;
    background:var(--grey-100);border-radius:8px;margin-bottom:8px;font-size:13.5px;line-height:1.5;
  }
  .qlist li::before{
    content:counter(q);position:absolute;left:12px;top:12px;
    width:20px;height:20px;border-radius:50%;background:var(--red);color:white;
    font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;
  }
  .qlist li .opts{display:block;margin-top:4px;font-size:11.5px;color:var(--grey-400);font-family:'IBM Plex Mono',monospace;}

  .empty-note{color:var(--grey-400);font-size:13px;padding:20px;text-align:center;}
  .copybox{
    width:100%;min-height:220px;font-family:'IBM Plex Mono',monospace;font-size:12px;
    border:1px solid var(--grey-200);border-radius:8px;padding:12px;white-space:pre-wrap;background:var(--grey-100);
  }
  .visual-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;}
  .visual-card{border:1px solid var(--grey-200);border-radius:10px;overflow:hidden;background:var(--white);}
  .visual-card img{width:100%;height:110px;object-fit:cover;cursor:pointer;display:block;}
  .visual-card-label{padding:8px 10px;font-size:11.5px;}
  .visual-card-label strong{display:block;margin-bottom:2px;}
  .visual-card-label span{color:var(--grey-400);}

  .visual-toggle-btn{
    margin-top:6px;font-size:11px;padding:5px 10px;border-radius:6px;
    border:1px solid var(--grey-200);color:var(--grey-700);background:var(--white);
    display:inline-flex;align-items:center;gap:5px;
  }
  .visual-toggle-btn:hover{border-color:var(--red);color:var(--red);background:var(--white);}
  .visual-picker-grid{
    display:none;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px;
    margin-top:8px;padding:10px;background:var(--grey-100);border-radius:8px;
  }
  .visual-picker-card{
    position:relative;cursor:pointer;border-radius:7px;overflow:hidden;
    border:2px solid transparent;background:var(--white);
  }
  .visual-picker-card.selected{border-color:var(--red);}
  .visual-picker-card img{width:100%;height:56px;object-fit:cover;display:block;}
  .vp-placeholder{
    width:100%;height:56px;display:flex;align-items:center;justify-content:center;
    background:var(--grey-200);color:var(--grey-400);font-size:16px;font-weight:600;
  }
  .vp-caption{font-size:9px;padding:3px 4px;line-height:1.25;color:var(--grey-700);}
  .vp-mini-attach{
    position:absolute;top:3px;right:3px;background:rgba(31,33,36,.65);color:white;
    width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:9px;cursor:pointer;
  }

  .thumb-wrap{display:flex;align-items:center;gap:6px;margin-top:6px;}
  .ref-thumb{width:38px;height:38px;object-fit:cover;border-radius:6px;border:1px solid var(--grey-200);cursor:pointer;}
  .thumb-btn{
    width:22px;height:22px;padding:0;border-radius:50%;font-size:11px;line-height:1;
    display:flex;align-items:center;justify-content:center;border:1px solid var(--grey-200);color:var(--grey-700);
  }
  .thumb-add{
    font-size:11px;padding:5px 9px;border-radius:6px;border:1px dashed var(--grey-400);
    color:var(--grey-400);background:transparent;
  }
  .thumb-add:hover{color:var(--red);border-color:var(--red);background:transparent;}
  .attach-panel{
    position:fixed;inset:0;background:rgba(31,33,36,.55);z-index:200;
    display:flex;align-items:center;justify-content:center;
  }
  .attach-inner{
    background:white;border-radius:12px;padding:22px 24px;width:min(400px,90vw);
  }
  .attach-inner h3{margin:0 0 4px;font-size:15px;}
  .attach-sub{margin:0 0 14px;font-size:12.5px;color:var(--grey-400);}
  .attach-label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--grey-700);font-weight:500;margin-bottom:6px;}
  .attach-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .lightbox{
    position:fixed;inset:0;background:rgba(31,33,36,.85);z-index:300;
    display:flex;align-items:center;justify-content:center;
  }
  .lightbox-inner{text-align:center;max-width:90vw;max-height:90vh;}
  .lightbox-inner img{max-width:90vw;max-height:78vh;border-radius:8px;}
  .lightbox-inner p{color:white;margin:12px 0;font-size:13px;}

  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    background:var(--grey-900);color:white;padding:10px 18px;border-radius:8px;font-size:13px;
    opacity:0;pointer-events:none;transition:.2s;
  }
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand">
      <div class="mark">M</div>
      <div>
        <h1>Read Me — Option List Filler</h1>
        <p>MLK Houses</p>
      </div>
    </div>
    <div class="progress-wrap">
      <div class="progress-label"><span>Aizpildīts</span><span id="progressText">0 / 0</span></div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>
  </header>

  <div class="meta-card">
    <div class="meta-grid">
      <div class="field">
        <label>Projekta Nr.</label>
        <input type="text" id="metaProject" placeholder="TR-106">
      </div>
      <div class="field">
        <label>Klients</label>
        <input type="text" id="metaClient" placeholder="Vārds Uzvārds">
      </div>
      <div class="field">
        <label>Zīmētājs</label>
        <select id="metaDrawer"><option value="">—</option></select>
      </div>
      <div class="field">
        <label>Pārbaudīja</label>
        <select id="metaChecker"><option value="">—</option></select>
      </div>
      <div class="field">
        <label>Datums</label>
        <input type="text" id="metaDate" placeholder="2026-08-27">
      </div>
    </div>
  </div>

  <div class="toolbar">
    <button class="primary" id="btnGenerate">Ģenerēt rezultātus</button>
    <button class="ghost" id="btnExpandAll">Atvērt visas sadaļas</button>
    <button class="ghost" id="btnCollapseAll">Aizvērt visas sadaļas</button>
    <button class="ghost" id="btnSave">Lejupielādēt melnrakstu</button>
    <button class="ghost" id="btnLoad">Ielādēt melnrakstu no faila</button>
    <input type="file" id="draftFileInput" accept="application/json" style="display:none;">
    <button class="ghost" id="btnSaveImages">Lejupielādēt bilžu bibliotēku</button>
    <button class="ghost" id="btnLoadImages">Ielādēt bilžu bibliotēku</button>
    <input type="file" id="imageLibFileInput" accept="application/json" style="display:none;">
    <button class="ghost" id="btnReset">Notīrīt visu</button>
  </div>

  <div id="sections"></div>

  <div class="meta-card">
    <label style="display:block;font-size:11px;color:var(--grey-700);margin-bottom:6px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;">Vispārīgi komentāri / Piezīmes</label>
    <textarea id="generalNotes" placeholder="Jebkāda papildu informācija par projektu kopumā..." style="min-height:80px;resize:vertical;"></textarea>
  </div>

  <div class="results" id="results" style="display:none;">
    <h2>Rezultāti</h2>
    <div class="tabs">
      <div class="tab active" data-tab="filled">Aizpildītais saraksts</div>
      <div class="tab" data-tab="visual">Vizuālā atlase</div>
      <div class="tab" data-tab="questions">Jautājumi klientam (EN)</div>
    </div>
    <div class="tabpanel active" id="tab-filled"></div>
    <div class="tabpanel" id="tab-visual"></div>
    <div class="tabpanel" id="tab-questions"></div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
/* ---------------------------------------------------------------
   FIELD SCHEMA — derived from MLK "Read Me" option-list template
   (TR- sheet + Details dropdown source ranges)
---------------------------------------------------------------- */
const NONE_VALUES = ['nav info','no info','n/a',''];

const drawers = ['Raivis Trofimovs','Ilvars Jermacāns'];
const checkers = ['Raivis Trofimovs','Ilvars Jermacāns','Miks Celmiņš','Gatis Viška','Kaspars Bērtelsons'];

const SECTIONS = [
  {
    name: 'Konstrukcija',

      { id:'dim_width', lv:'Dimensijas — platums (mm)', en:'Width (mm)', type:'select',

      { id:'dim_length', lv:'Dimensijas — garums (mm)', en:'Length (mm)', type:'number' },
      { id:'dim_l', lv:'Dimensijas L-mājai', en:'L-shape wing dimensions (mm)', type:'text' },
      { id:'area', lv:'Platība (m²)', en:'Floor area (m²)', type:'number' },

  {

      { id:'facade', lv:'Fasāde', en:'Facade cladding', type:'select',

      { id:'facade_treat', lv:'Fasādes apstrāde', en:'Facade treatment / finish', type:'select',
        options:['Neapstrādāta','Eļļota','Krāsota','Nē'] },
      { id:'roof_type', lv:'Jumta tips', en:'Roof type', type:'select',
        options:['Taisns','Slīps','Slīps - Nestandarta'] },

        options:['Koka','Metāla','Sedums','EPDM'] },
      { id:'roof_window', lv:'Jumta logs — tips', en:'Roof window type', type:'select',

      { id:'roof_window_qty', lv:'Jumta logs — skaits', en:'Roof window quantity', type:'select',
        options:['0','1','2','3','4'] },
      { id:'loft', lv:'Lofts', en:'Loft layout', type:'select',
        options:['Nē','WC','WC + Guļamistaba','Nestandarta'] },
      { id:'facade_light_h', lv:'Fasādes apgaismojuma augstums (mm)', en:'Facade lighting height (mm)', type:'select',
        options:['2360','2500','2670'] },
      { id:'floor_house', lv:'Mājas — grīdas segums (zīmols)', en:'House flooring brand', type:'select',
        options:['Falquon','Quickstep'] },
      { id:'floor_house_pattern', lv:'Mājas — grīdas segums (raksts)', en:'House flooring pattern', type:'select',

    ]
  },
  {
    name: 'Elektrība un klimats',
    fields: [
      { id:'thermostats', lv:'Termostati', en:'Thermostats', type:'select',
        options:['701','801 - Balts','801 - Melns'] },
      { id:'switches', lv:'Slēdži', en:'Light switches', type:'select',
        options:['Standarta','Kinetic','Kinetic / WI-FI'] },
      { id:'extra_led', lv:'Extra LED', en:'Extra LED lighting', type:'select',
        options:['Nē','Sijās','Terasē','Sijā + Terasē'] },
      { id:'ac', lv:'AC', en:'Air conditioning', type:'select',
        options:['Nē','Airco - AUX 2.5 Kw','Airco - AUX 3.5 Kw'] },
      { id:'solar', lv:'Saules paneļi', en:'Solar panels', type:'select', options:['Jā','Nē'] },

      { id:'floor_wc', lv:'WC — grīdas segums', en:'Bathroom flooring', type:'select',

      { id:'vent_plus', lv:'Air Vent (+)', en:'Supply air vents (qty)', type:'select',

  {
    name: 'Virtuve',

      { id:'kitchen_front', lv:'Fasāde (virtuve)', en:'Kitchen cabinet front / colour code', type:'select',
        options:['U999 / ST9','W1000 / ST76','Macaron - U636 / ST9','U960','U702','T-Zaļš - U665 PM / ST9','Wallnut - H1714'] },
      { id:'countertop', lv:'Galda virsma', en:'Countertop', type:'select',
        options:['U999 ST76','W1000 / ST76','F186 / ST9','Marmors - F800 pt','Ozols - H3730 / ST10'] },

/* ---------------------------------------------------------------
   STATE
---------------------------------------------------------------- */
const state = {}; // fieldId -> { value, other, comment }

function isNone(v){
  if(v===undefined||v===null) return true;
  return NONE_VALUES.includes(String(v).trim().toLowerCase());
}

function fieldState(id){
  if(!state[id]) state[id] = { value:'', other:'', comment:'' };
  return state[id];
}

/* ---------------------------------------------------------------
   IMAGE LIBRARY — reference photos attached to specific option
   values (e.g. "kitchen_front" + "U960" -> photo). Reusable
   across projects; stored separately from per-project drafts.
---------------------------------------------------------------- */
const IMAGE_LIB = {}; // key: `${fieldId}::${value}` -> { type:'data'|'url', src }

function imgKey(fieldId, value){ return fieldId + '::' + value; }
function getImage(fieldId, value){
  if(!value) return null;
  return IMAGE_LIB[imgKey(fieldId, value)] || null;
}
function setImage(fieldId, value, entry){
  if(!value) return;
  IMAGE_LIB[imgKey(fieldId, value)] = entry;
}
function removeImage(fieldId, value){
  delete IMAGE_LIB[imgKey(fieldId, value)];
}

// Downscale + compress an uploaded image file to keep the library file small
function compressImageFile(file, maxSize=480, quality=0.75){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let { width, height } = img;
        if(width > height && width > maxSize){ height = Math.round(height*maxSize/width); width = maxSize; }
        else if(height > maxSize){ width = Math.round(width*maxSize/height); height = maxSize; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

const sectionsEl = document.getElementById('sections');

function renderSelectOptions(sel, options, current){
  sel.innerHTML = '<option value="">— izvēlies —</option>' +
    options.map(o=>`<option value="${escAttr(o)}" ${o===current?'selected':''}>${escHtml(o)}</option>`).join('') +
    `<option value="__other__" ${current==='__other__'?'selected':''}>Cits / precizēt tekstā…</option>`;
}

function escHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escAttr(s){ return escHtml(s); }

function buildForm(){
  sectionsEl.innerHTML = '';
  SECTIONS.forEach((sec, sIdx)=>{
    const secEl = document.createElement('div');
    secEl.className = 'section';
    secEl.dataset.section = sIdx;

    const head = document.createElement('div');
    head.className = 'section-head';
    head.innerHTML = `<h2>${escHtml(sec.name)}</h2><div style="display:flex;align-items:center;gap:10px;">
      <span class="count" data-count="${sIdx}"></span>
      <span class="chevron">▾</span></div>`;
    head.addEventListener('click', ()=>{ secEl.classList.toggle('collapsed'); });

    const body = document.createElement('div');
    body.className = 'section-body';

    sec.fields.forEach(f=>{
      const row = document.createElement('div');
      row.className = 'row';
      row.dataset.field = f.id;

      const lv = document.createElement('div');
      lv.className = 'lv';
      lv.innerHTML = `${escHtml(f.lv)}<small>${escHtml(f.en)}</small>`;

      const inputWrap = document.createElement('div');
      const st = fieldState(f.id);

      if(f.type === 'select'){
        const sel = document.createElement('select');
        sel.id = 'sel-' + f.id;
        renderSelectOptions(sel, f.options, st.value);
        sel.addEventListener('change', ()=> selectOptionValue(f.id, sel.value));
        inputWrap.appendChild(sel);
        const otherInput = document.createElement('input');
        otherInput.type='text'; otherInput.placeholder='precizē...'; otherInput.className='extra-input';
        otherInput.id = 'other-' + f.id;
        otherInput.style.display = (st.value==='__other__') ? 'block':'none';
        otherInput.value = st.other||'';
        otherInput.addEventListener('input', ()=>{ st.other = otherInput.value; updateProgress(); renderThumb(f.id); });
        inputWrap.appendChild(otherInput);

        const visToggle = document.createElement('button');
        visToggle.type='button'; visToggle.className='visual-toggle-btn'; visToggle.id='visbtn-'+f.id;
        visToggle.textContent = '🖼 Vizuālā izvēle';
        visToggle.style.display = 'none';
        visToggle.addEventListener('click', ()=> toggleVisualPicker(f.id));
        inputWrap.appendChild(visToggle);

        const visGrid = document.createElement('div');
        visGrid.className = 'visual-picker-grid'; visGrid.id = 'visgrid-' + f.id;
        visGrid.style.display = 'none';
        inputWrap.appendChild(visGrid);

        const thumbWrap = document.createElement('div');
        thumbWrap.className = 'thumb-wrap';
        thumbWrap.id = 'thumbwrap-' + f.id;
        inputWrap.appendChild(thumbWrap);
      } else if(f.type === 'number'){
        const inp = document.createElement('input');
        inp.type='number'; inp.value = st.value||''; inp.placeholder=f.en;
        inp.addEventListener('input', ()=>{ st.value = inp.value; updateProgress(); });
        inputWrap.appendChild(inp);
      } else {
        const inp = document.createElement('input');
        inp.type='text'; inp.value = st.value||''; inp.placeholder=f.en;
        inp.addEventListener('input', ()=>{ st.value = inp.value; updateProgress(); });
        inputWrap.appendChild(inp);
      }

      const commentWrap = document.createElement('div');
      commentWrap.className = 'comment';
      const ta = document.createElement('textarea');
      ta.placeholder = 'Piezīme / specifikācija (nav obligāti)';
      ta.value = st.comment||'';
      ta.addEventListener('input', ()=>{ st.comment = ta.value; });
      commentWrap.appendChild(ta);

      const badge = document.createElement('div');
      badge.className = 'badge';
      badge.dataset.badge = f.id;

      row.appendChild(lv);
      row.appendChild(inputWrap);
      row.appendChild(commentWrap);
      row.appendChild(badge);
      body.appendChild(row);
      renderThumb(f.id);
    });

    secEl.appendChild(head);
    secEl.appendChild(body);
    sectionsEl.appendChild(secEl);
  });

  updateProgress();
}

function getEffectiveValue(f){
  const st = fieldState(f.id);
  if(f.type === 'select'){
    if(st.value === '__other__') return (st.other||'').trim();
    return st.value||'';
  }
  return (st.value||'').toString().trim();
}

function allFields(){
  const list = [];
  SECTIONS.forEach(sec=> sec.fields.forEach(f=>{ f.section = sec.name; list.push(f); }));
  return list;
}

const FIELDS_BY_ID = {};
allFields().forEach(f=> FIELDS_BY_ID[f.id] = f);

/* ---------------------------------------------------------------
   IMAGE THUMBNAIL — attach/view a reference photo per selected
   option value (select fields only)
---------------------------------------------------------------- */
function selectOptionValue(fieldId, value){
  const st = fieldState(fieldId);
  st.value = value;
  const sel = document.getElementById('sel-' + fieldId);
  if(sel) sel.value = value;
  const otherInput = document.getElementById('other-' + fieldId);
  if(otherInput){
    otherInput.style.display = (value==='__other__') ? 'block':'none';
    if(value!=='__other__') st.other='';
  }
  updateProgress();
  renderThumb(fieldId);
}

function renderThumb(fieldId){
  const wrap = document.getElementById('thumbwrap-' + fieldId);
  if(!wrap) return; // not a select field / no thumb slot
  const f = FIELDS_BY_ID[fieldId];
  renderVisualPicker(fieldId);
  const value = getEffectiveValue(f);
  const img = getImage(fieldId, value);

  wrap.innerHTML = '';
  if(!value){
    wrap.style.display = 'none';
    return;
  }
  wrap.style.display = 'flex';

  if(img){
    const thumb = document.createElement('img');
    thumb.className = 'ref-thumb';
    thumb.src = img.src;
    thumb.title = 'Skatīt / mainīt bildi';
    thumb.addEventListener('click', ()=> openLightbox(img.src, f.lv + ' — ' + value));
    wrap.appendChild(thumb);

    const changeBtn = document.createElement('button');
    changeBtn.type='button'; changeBtn.className='thumb-btn'; changeBtn.textContent='✎';
    changeBtn.title='Mainīt bildi';
    changeBtn.addEventListener('click', ()=> openAttachPanel(fieldId, value));
    wrap.appendChild(changeBtn);

    const rmBtn = document.createElement('button');
    rmBtn.type='button'; rmBtn.className='thumb-btn'; rmBtn.textContent='✕';
    rmBtn.title='Noņemt bildi';
    rmBtn.addEventListener('click', ()=>{ removeImage(fieldId, value); renderThumb(fieldId); });
    wrap.appendChild(rmBtn);
  } else {
    const addBtn = document.createElement('button');
    addBtn.type='button'; addBtn.className='thumb-add'; addBtn.textContent='📷 Pievienot bildi';
    addBtn.addEventListener('click', ()=> openAttachPanel(fieldId, value));
    wrap.appendChild(addBtn);
  }
}

/* ---------------------------------------------------------------
   VISUAL PICKER — clickable photo-card grid, shown for a select
   field once at least one of its options has an attached image
---------------------------------------------------------------- */
function renderVisualPicker(fieldId){
  const f = FIELDS_BY_ID[fieldId];
  const btn = document.getElementById('visbtn-' + fieldId);
  const grid = document.getElementById('visgrid-' + fieldId);
  if(!btn || !grid) return;
  const hasAnyImage = f.options.some(opt=> getImage(fieldId, opt));
  btn.style.display = hasAnyImage ? 'inline-flex' : 'none';
  if(!hasAnyImage){ grid.style.display='none'; grid.innerHTML=''; return; }
  if(grid.style.display !== 'none'){ populateVisualGrid(fieldId); } // already open — refresh contents
}

function toggleVisualPicker(fieldId){
  const grid = document.getElementById('visgrid-' + fieldId);
  const opening = grid.style.display === 'none';
  grid.style.display = opening ? 'grid' : 'none';
  if(opening) populateVisualGrid(fieldId);
}

function populateVisualGrid(fieldId){
  const f = FIELDS_BY_ID[fieldId];
  const grid = document.getElementById('visgrid-' + fieldId);
  const current = getEffectiveValue(f);
  grid.innerHTML = f.options.map(opt=>{
    const img = getImage(fieldId, opt);
    const selected = opt===current ? ' selected' : '';
    return `<div class="visual-picker-card${selected}" data-opt="${escAttr(opt)}">
      ${img
        ? `<img src="${escAttr(img.src)}" alt="">`
        : `<div class="vp-placeholder">${escHtml(opt.substring(0,2).toUpperCase())}</div>`}
      <span class="vp-mini-attach" title="Pievienot/mainīt bildi">📷</span>
      <div class="vp-caption">${escHtml(opt)}</div>
    </div>`;
  }).join('');

  grid.querySelectorAll('.visual-picker-card').forEach(card=>{
    const opt = card.dataset.opt;
    card.addEventListener('click', (e)=>{
      if(e.target.classList.contains('vp-mini-attach')) return; // handled separately below
      selectOptionValue(fieldId, opt);
      grid.style.display = 'none';
    });
    card.querySelector('.vp-mini-attach').addEventListener('click', (e)=>{
      e.stopPropagation();
      openAttachPanel(fieldId, opt);
    });
  });
}

function openAttachPanel(fieldId, value){
  // remove any existing panel
  const existing = document.getElementById('attach-panel');
  if(existing) existing.remove();

  const panel = document.createElement('div');
  panel.id = 'attach-panel';
  panel.className = 'attach-panel';
  panel.innerHTML = `
    <div class="attach-inner">
      <h3>Pievienot bildi</h3>
      <p class="attach-sub">${escHtml(FIELDS_BY_ID[fieldId].lv)} — <strong>${escHtml(value)}</strong></p>
      <label class="attach-label">Augšupielādēt no datora</label>
      <input type="file" accept="image/*" id="attachFileInput">
      <label class="attach-label" style="margin-top:12px;">...vai ielīmēt attēla saiti (URL)</label>
      <input type="text" id="attachUrlInput" placeholder="https://...">
      <div class="attach-actions">
        <button type="button" class="ghost" id="attachCancel">Atcelt</button>
        <button type="button" class="primary" id="attachSaveUrl">Saglabāt saiti</button>
      </div>
    </div>
  `;
  document.body.appendChild(panel);

  document.getElementById('attachCancel').addEventListener('click', ()=> panel.remove());
  document.getElementById('attachFileInput').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    try{
      const dataUrl = await compressImageFile(file);
      setImage(fieldId, value, { type:'data', src: dataUrl });
      renderThumb(fieldId);
      panel.remove();
      showToast('Bilde pievienota');
    }catch(err){
      showToast('Neizdevās ielādēt bildi');
      console.error(err);
    }
  });
  document.getElementById('attachSaveUrl').addEventListener('click', ()=>{
    const url = document.getElementById('attachUrlInput').value.trim();
    if(!url){ showToast('Ievadi saiti vai izvēlies failu'); return; }
    setImage(fieldId, value, { type:'url', src: url });
    renderThumb(fieldId);
    panel.remove();
    showToast('Bilde pievienota (saite)');
  });
}

function openLightbox(src, caption){
  const existing = document.getElementById('lightbox');
  if(existing) existing.remove();
  const lb = document.createElement('div');
  lb.id = 'lightbox';
  lb.className = 'lightbox';
  lb.innerHTML = `<div class="lightbox-inner">
      <img src="${escAttr(src)}">
      <p>${escHtml(caption)}</p>
      <button type="button" class="ghost" id="lbClose">Aizvērt</button>
    </div>`;
  lb.addEventListener('click', (e)=>{ if(e.target===lb) lb.remove(); });
  document.body.appendChild(lb);
  document.getElementById('lbClose').addEventListener('click', ()=> lb.remove());
}

function updateProgress(){
  let filled = 0, total = 0;
  SECTIONS.forEach((sec, sIdx)=>{
    let secFilled = 0;
    sec.fields.forEach(f=>{
      total++;
      const val = getEffectiveValue(f);
      const ok = val && !isNone(val);
      if(ok) { filled++; secFilled++; }
      const badge = document.querySelector(`[data-badge="${f.id}"]`);
      if(badge){
        if(ok){ badge.className='badge ok'; badge.textContent='Saskaņots / OK'; }
        else { badge.className='badge none'; badge.textContent='Jāprecizē'; }
      }
    });
    const countEl = document.querySelector(`[data-count="${sIdx}"]`);
    if(countEl) countEl.textContent = `${secFilled}/${sec.fields.length}`;
  });
  document.getElementById('progressText').textContent = `${filled} / ${total}`;
  document.getElementById('progressFill').style.width = total? (filled/total*100)+'%':'0%';
}

function generateResults(){
  const results = document.getElementById('results');
  results.style.display='block';

  // Filled table
  const rows = allFields().map(f=>{
    const val = getEffectiveValue(f);
    const ok = val && !isNone(val);
    const comment = (fieldState(f.id).comment||'').trim();
    return { section:f.section, lv:f.lv, en:f.en, val: val || '—', ok, comment };
  });
  const generalNotesVal = document.getElementById('generalNotes').value.trim();
  const tableHtml = `
    <table class="filled">
      <thead><tr><th>Lauks (LV)</th><th>Field (EN)</th><th>Vērtība</th><th>Piezīme</th><th>Statuss</th></tr></thead>
      <tbody>
        ${rows.map(r=>`<tr>
          <td>${escHtml(r.lv)}</td>
          <td style="color:#8a8f96;">${escHtml(r.en)}</td>
          <td>${escHtml(r.val)}</td>
          <td style="color:#3d4045;">${escHtml(r.comment||'—')}</td>
          <td class="${r.ok?'status-ok':'status-warn'}">${r.ok?'Saskaņots / OK':'Jāprecizē'}</td>
        </tr>`).join('')}
      </tbody>
    </table>
    ${generalNotesVal ? `<div style="margin-top:16px;padding:12px 14px;background:var(--grey-100);border-radius:8px;font-size:13px;">
      <strong style="display:block;margin-bottom:4px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--grey-700);">Vispārīgi komentāri</strong>
      ${escHtml(generalNotesVal).replace(/\n/g,'<br>')}
    </div>` : ''}
    <div class="toolbar" style="margin-top:16px;">
      <button class="primary" id="btnDownloadXlsx">Lejupielādēt Excel</button>
      <button class="primary" id="btnDownloadPdf">Lejupielādēt PDF (MLK dizains)</button>
      <button class="ghost" id="btnCopyTable">Kopēt tabulu</button>
    </div>
  `;
  document.getElementById('tab-filled').innerHTML = tableHtml;
  document.getElementById('btnDownloadXlsx').addEventListener('click', downloadXlsx);
  document.getElementById('btnDownloadPdf').addEventListener('click', downloadPdf);

  // Visual selection tab
  const visualItems = allFields()
    .map(f=> ({ f, val: getEffectiveValue(f) }))
    .filter(x=> x.val && getImage(x.f.id, x.val));
  if(visualItems.length===0){
    document.getElementById('tab-visual').innerHTML = `<div class="empty-note">Nav pievienota neviena bilde. Pie katras izvēles laukā (aiz izvēlnes) spied "📷 Pievienot bildi".</div>`;
  } else {
    document.getElementById('tab-visual').innerHTML = `<div class="visual-grid">
      ${visualItems.map(x=>{
        const img = getImage(x.f.id, x.val);
        return `<div class="visual-card">
          <img src="${escAttr(img.src)}" data-src="${escAttr(img.src)}" data-caption="${escAttr(x.f.lv+' — '+x.val)}">
          <div class="visual-card-label"><strong>${escHtml(x.f.lv)}</strong><span>${escHtml(x.val)}</span></div>
        </div>`;
      }).join('')}
    </div>`;
    document.querySelectorAll('.visual-card img').forEach(img=>{
      img.addEventListener('click', ()=> openLightbox(img.dataset.src, img.dataset.caption));
    });
  }
  document.getElementById('btnCopyTable').addEventListener('click', ()=>{
    const generalNotes = document.getElementById('generalNotes').value.trim();
    let text = rows.map(r=>`${r.lv} (${r.en}): ${r.val}${r.comment? '  [Piezīme: '+r.comment+']':''}${r.ok?'':'  [JĀPRECIZĒ]'}`).join('\n');

    copyToClipboard(text);
  });

  // Questions for client
  const project = document.getElementById('metaProject').value.trim() || 'the project';
  const client = document.getElementById('metaClient').value.trim();
  const missing = allFields().map(f=>{
    const val = getEffectiveValue(f);
    return { f, val, ok: val && !isNone(val) };
  }).filter(x=>!x.ok);

  let qHtml = '';
  let qText = '';
  if(missing.length===0){
    qHtml = `<div class="empty-note">Visi lauki aizpildīti — nav jautājumu, ko sūtīt klientam. 🎉</div>`;
  } else {
    const greeting = client ? `Hi ${client},` : `Hi,`;
    qText += `${greeting}\n\nTo finalize the specification for ${project}, could you please confirm the following ${missing.length} item${missing.length>1?'s':''}?\n\n`;
    const items = missing.map((m,i)=>{
      const commentNote = fieldState(m.f.id).comment ? ` (${fieldState(m.f.id).comment})` : '';
      return {
        num: i+1,
        text: `${m.f.en}${commentNote}`
      };
    });
    qText += items.map(it=>`${it.num}. ${it.text}`).join('\n');
    qText += `\n\nThanks,\n`;

    qHtml = `<ul class="qlist">` + items.map(it=>`<li>${escHtml(it.text)}</li>`).join('') + `</ul>
    <div class="toolbar">
      <button class="primary" id="btnCopyEmail">Kopēt e-pasta tekstu</button>
    </div>
    <label style="font-size:11px;color:var(--grey-400);text-transform:uppercase;letter-spacing:.04em;display:block;margin-top:14px;margin-bottom:6px;">E-pasta priekšskatījums</label>
    <div class="copybox">${escHtml(qText)}</div>`;
  }
  document.getElementById('tab-questions').innerHTML = qHtml;
  const copyBtn = document.getElementById('btnCopyEmail');
  if(copyBtn) copyBtn.addEventListener('click', ()=> copyToClipboard(qText));

  results.scrollIntoView({behavior:'smooth', block:'start'});
}

function copyToClipboard(text){
  navigator.clipboard.writeText(text).then(()=> showToast('Nokopēts starpliktuvē'));
}

});

function downloadXlsx(){
  const wsData = [
    ['MLK Houses — Read Me / Option List'],
    ['Projekts', document.getElementById('metaProject').value, 'Klients', document.getElementById('metaClient').value],
    ['Zīmētājs', document.getElementById('metaDrawer').value, 'Pārbaudīja', document.getElementById('metaChecker').value],
    ['Datums', document.getElementById('metaDate').value],
    [],
    ['Sadaļa','Lauks (LV)','Field (EN)','Vērtība','Statuss','Piezīme']
  ];
  SECTIONS.forEach(sec=>{
    sec.fields.forEach(f=>{
      const val = getEffectiveValue(f);
      const ok = val && !isNone(val);
      wsData.push([sec.name, f.lv, f.en, val||'—', ok?'Saskaņots / OK':'Jāprecizē', fieldState(f.id).comment||'']);
    });
  });
  const generalNotesXlsx = document.getElementById('generalNotes').value.trim();
  if(generalNotesXlsx){
    wsData.push([]);
    wsData.push(['Vispārīgi komentāri']);
    generalNotesXlsx.split('\n').forEach(line=> wsData.push([line]));
  }
  const ws = XLSX.utils.aoa_to_sheet(wsData);
  ws['!cols'] = [{wch:20},{wch:32},{wch:34},{wch:34},{wch:16},{wch:40}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Read Me');
  const projectName = document.getElementById('metaProject').value.trim() || 'project';
  XLSX.writeFile(wb, `ReadMe_${projectName}.xlsx`);
}

function urlToDataURL(url){
  return fetch(url, { mode:'cors' })
    .then(res=> res.blob())
    .then(blob=> new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onload = ()=> resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    }))
    .catch(()=> null);
}

async function downloadPdf(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit:'pt', format:'a4' });

  // Register Unicode font with full Latvian diacritic support (ā č ē ģ ī ķ ļ ņ š ū ž)
  doc.addFileToVFS('NotoSans-Regular.ttf', NOTOSANS_REGULAR_B64);
  doc.addFont('NotoSans-Regular.ttf', 'NotoSans', 'normal');
  doc.addFileToVFS('NotoSans-Bold.ttf', NOTOSANS_BOLD_B64);
  doc.addFont('NotoSans-Bold.ttf', 'NotoSans', 'bold');
  doc.setFont('NotoSans','normal');

  const RED = [192,57,43];
  const DARK = [31,33,36];
  const GREY = [138,143,150];
  const pageWidth = doc.internal.pageSize.getWidth();
  const margin = 40;

  // Header band
  doc.setFillColor(...DARK);
  doc.rect(0,0,pageWidth,86,'F');
  // Logo mark (rounded square with "M")
  doc.setFillColor(...RED);
  doc.roundedRect(margin, 22, 40, 40, 6, 6, 'F');
  doc.setTextColor(255,255,255);
  doc.setFont('NotoSans','bold');
  doc.setFontSize(20);
  doc.text('M', margin+20, 49, {align:'center'});
  // Title
  doc.setFont('NotoSans','bold');
  doc.setFontSize(16);
  doc.setTextColor(255,255,255);
  doc.text('MLK Houses — Read Me / Option List', margin+54, 42);
  doc.setFont('NotoSans','normal');
  doc.setFontSize(10);
  doc.setTextColor(220,220,220);
  doc.text('mlkhouses.com', margin+54, 58);

  // Meta row
  const project = document.getElementById('metaProject').value.trim() || '—';
  const client = document.getElementById('metaClient').value.trim() || '—';
  const drawer = document.getElementById('metaDrawer').value || '—';
  const checker = document.getElementById('metaChecker').value || '—';
  const date = document.getElementById('metaDate').value.trim() || new Date().toISOString().slice(0,10);

  let y = 110;
  doc.setTextColor(...DARK);
  doc.setFont('NotoSans','bold'); doc.setFontSize(10);
  const metaCols = [
    ['Project', project], ['Client', client],
    ['Prepared by', drawer], ['Checked by', checker], ['Date', date]
  ];
  const colW = (pageWidth - margin*2)/metaCols.length;
  metaCols.forEach((m,i)=>{
    const x = margin + i*colW;
    doc.setFont('NotoSans','bold'); doc.setFontSize(8); doc.setTextColor(...GREY);
    doc.text(m[0].toUpperCase(), x, y);
    doc.setFont('NotoSans','normal'); doc.setFontSize(10.5); doc.setTextColor(...DARK);
    doc.text(String(m[1]).substring(0,26), x, y+14);
  });

  y += 34;
  doc.setDrawColor(...RED);
  doc.setLineWidth(1.5);
  doc.line(margin, y, pageWidth-margin, y);
  y += 14;

  // Build grouped rows by section
  const body = [];
  let currentSection = null;
  SECTIONS.forEach(sec=>{
    sec.fields.forEach(f=>{
      const val = getEffectiveValue(f);
      const ok = val && !isNone(val);
      const comment = (fieldState(f.id).comment||'').trim();
      if(sec.name !== currentSection){
        body.push([{ content: sec.name, colSpan:4, styles:{ fillColor:[244,245,246], textColor:RED, fontStyle:'bold', fontSize:9.5, font:'NotoSans' } }]);
        currentSection = sec.name;
      }
      body.push([
        f.lv,
        val || '—',
        comment || '',
        { content: ok ? 'OK' : 'To confirm', styles:{ textColor: ok? [47,143,91]:[201,138,26], fontStyle:'bold', font:'NotoSans' } }
      ]);
    });
  });

  doc.autoTable({
    startY: y,
    head: [['Field','Value','Note','Status']],
    body: body,
    margin: { left: margin, right: margin },
    styles: { font:'NotoSans', fontStyle:'normal', fontSize:9, cellPadding:5, textColor: DARK, lineColor:[228,230,233], lineWidth:0.5 },
    headStyles: { fillColor: DARK, textColor:255, font:'NotoSans', fontStyle:'bold', fontSize:9 },
    alternateRowStyles: { fillColor:[250,250,250] },
    columnStyles: {
      0:{ cellWidth: 150 },
      1:{ cellWidth: 150 },
      2:{ cellWidth: 130 },
      3:{ cellWidth: 70 }
    },
    didParseCell: function(data){
      if(data.row.raw.length===1){ data.cell.colSpan = 4; }
    }
  });

  const pageCount1 = doc.internal.getNumberOfPages();
  doc.setPage(pageCount1);
  const generalNotesPdf = document.getElementById('generalNotes').value.trim();
  if(generalNotesPdf){
    let noteY = doc.lastAutoTable.finalY + 24;
    const pageHeight = doc.internal.pageSize.getHeight();
    if(noteY > pageHeight - 100){ doc.addPage(); noteY = 50; }
    doc.setFont('NotoSans','bold'); doc.setFontSize(10); doc.setTextColor(...RED);
    doc.text('GENERAL NOTES', margin, noteY);
    doc.setFont('NotoSans','normal'); doc.setFontSize(9.5); doc.setTextColor(...DARK);
    const wrapped = doc.splitTextToSize(generalNotesPdf, pageWidth - margin*2);
    doc.text(wrapped, margin, noteY + 16);
  }

  // Visual reference appendix
  const visualItems = allFields()
    .map(f=> ({ f, val: getEffectiveValue(f) }))
    .filter(x=> x.val && getImage(x.f.id, x.val));

  if(visualItems.length){
    doc.addPage();
    doc.setFont('NotoSans','bold'); doc.setFontSize(13); doc.setTextColor(...RED);
    doc.text('VISUAL REFERENCE', margin, 50);
    let iy = 74, col = 0;
    const thumbSize = 108, gap = 16;
    const perRow = Math.max(1, Math.floor((pageWidth - margin*2 + gap) / (thumbSize+gap)));
    const pageHeight = doc.internal.pageSize.getHeight();

    for(const item of visualItems){
      const entry = getImage(item.f.id, item.val);
      let src = entry.src;
      if(entry.type === 'url'){
        const converted = await urlToDataURL(src);
        if(!converted) continue; // couldn't fetch (offline / CORS) — skip, still visible on screen
        src = converted;
      }
      if(iy + thumbSize + 30 > pageHeight - 40){ doc.addPage(); iy = 50; col = 0; }
      const x = margin + col*(thumbSize+gap);
      const fmt = /image\/png/i.test(src) ? 'PNG' : 'JPEG';
      try{ doc.addImage(src, fmt, x, iy, thumbSize, thumbSize, undefined, 'FAST'); }
      catch(e){ continue; }
      doc.setFont('NotoSans','bold'); doc.setFontSize(8); doc.setTextColor(...DARK);
      const labelLines = doc.splitTextToSize(item.f.lv, thumbSize);
      doc.text(labelLines, x, iy+thumbSize+11);
      doc.setFont('NotoSans','normal'); doc.setFontSize(7.5); doc.setTextColor(...GREY);
      doc.text(String(item.val).substring(0,32), x, iy+thumbSize+11+labelLines.length*9);
      col++;
      if(col>=perRow){ col=0; iy += thumbSize+34; }
    }
  }

  const pageCount = doc.internal.getNumberOfPages();
  for(let i=1;i<=pageCount;i++){
    doc.setPage(i);
    doc.setFont('NotoSans','normal');
    doc.setFontSize(8);
    doc.setTextColor(...GREY);
    doc.text('MLK Houses', margin, doc.internal.pageSize.getHeight()-20);
    doc.text(`${i} / ${pageCount}`, pageWidth-margin, doc.internal.pageSize.getHeight()-20, {align:'right'});
  }

  doc.save(`ReadMe_${project!=='—'?project:'project'}.pdf`);
}

/* ---------------------------------------------------------------
   EXPAND / COLLAPSE
---------------------------------------------------------------- */
document.getElementById('btnExpandAll').addEventListener('click', ()=>{
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('collapsed'));
});
document.getElementById('btnCollapseAll').addEventListener('click', ()=>{
  document.querySelectorAll('.section').forEach(s=>s.classList.add('collapsed'));
});

/* ---------------------------------------------------------------
   RESET
---------------------------------------------------------------- */
document.getElementById('btnReset').addEventListener('click', ()=>{
  if(!confirm('Notīrīt visus ievadītos datus?')) return;
  Object.keys(state).forEach(k=> delete state[k]);
  document.getElementById('metaProject').value='';
  document.getElementById('metaClient').value='';
  document.getElementById('metaDrawer').value='';
  document.getElementById('metaChecker').value='';
  document.getElementById('metaDate').value='';
  document.getElementById('generalNotes').value='';
  document.getElementById('results').style.display='none';
  buildForm();
});

/* ---------------------------------------------------------------
   SAVE / LOAD DRAFT (as a .json file — works everywhere, no
   dependence on browser storage settings)
---------------------------------------------------------------- */
document.getElementById('btnSave').addEventListener('click', ()=>{
  const project = document.getElementById('metaProject').value.trim() || 'projekts';
  const payload = {
    meta: {
      project,
      client: document.getElementById('metaClient').value,
      drawer: document.getElementById('metaDrawer').value,
      checker: document.getElementById('metaChecker').value,
      date: document.getElementById('metaDate').value,
      generalNotes: document.getElementById('generalNotes').value,
    },
    state
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Melnraksts_${project}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Melnraksts lejupielādēts: Melnraksts_'+project+'.json');
});

document.getElementById('btnLoad').addEventListener('click', ()=>{
  document.getElementById('draftFileInput').click();
});

document.getElementById('draftFileInput').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt)=>{
    try{
      const payload = JSON.parse(evt.target.result);
      document.getElementById('metaProject').value = payload.meta.project||'';
      document.getElementById('metaClient').value = payload.meta.client||'';
      document.getElementById('metaDrawer').value = payload.meta.drawer||'';
      document.getElementById('metaChecker').value = payload.meta.checker||'';
      document.getElementById('metaDate').value = payload.meta.date||'';
      document.getElementById('generalNotes').value = payload.meta.generalNotes||'';
      Object.keys(state).forEach(k=> delete state[k]);
      Object.assign(state, payload.state||{});
      buildForm();
      showToast('Melnraksts ielādēts: '+(payload.meta.project||''));
    }catch(err){
      showToast('Neizdevās nolasīt failu — pārbaudi, vai tas ir pareizais .json');
      console.error(err);
    }
    e.target.value = '';
  };
  reader.readAsText(file);
});

/* ---------------------------------------------------------------
   IMAGE LIBRARY — export / import (.json, shareable between
   colleagues, reused across every project)
---------------------------------------------------------------- */
document.getElementById('btnSaveImages').addEventListener('click', ()=>{
  const count = Object.keys(IMAGE_LIB).length;
  if(count===0){ showToast('Bibliotēka ir tukša — pievieno vismaz vienu bildi'); return; }
  const blob = new Blob([JSON.stringify(IMAGE_LIB, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'MLK_attelu_biblioteka.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast(`Bibliotēka lejupielādēta (${count} bildes)`);
});

document.getElementById('btnLoadImages').addEventListener('click', ()=>{
  document.getElementById('imageLibFileInput').click();
});

document.getElementById('imageLibFileInput').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt)=>{
    try{
      const lib = JSON.parse(evt.target.result);
      Object.assign(IMAGE_LIB, lib);
      allFields().forEach(f=> renderThumb(f.id));
      showToast(`Bibliotēka ielādēta (${Object.keys(lib).length} bildes)`);
    }catch(err){
      showToast('Neizdevās nolasīt bibliotēkas failu');
      console.error(err);
    }
    e.target.value = '';
  };
  reader.readAsText(file);
});

/* ---------------------------------------------------------------
   TOAST
---------------------------------------------------------------- */
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2400);
}

/* ---------------------------------------------------------------
   INIT
---------------------------------------------------------------- */
fillMetaSelects();
buildForm();

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
